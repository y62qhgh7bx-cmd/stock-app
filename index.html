<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="股票記帳">
<meta name="theme-color" content="#0f1923">
<title>股票記帳</title>
<style>
:root {
  --bg: #0f1923;
  --bg2: #1a2535;
  --bg3: #232f42;
  --bg4: #2d3d55;
  --accent: #3b82f6;
  --accent2: #60a5fa;
  --green: #22c55e;
  --red: #ef4444;
  --text: #f0f4f8;
  --text2: #94a3b8;
  --text3: #64748b;
  --border: rgba(255,255,255,0.08);
  --radius: 14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, 'PingFang TC', 'Heiti TC', sans-serif; }
#app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }

/* ── NAV BAR ── */
#navbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,25,35,0.9); backdrop-filter: blur(20px);
  padding: 12px 20px 0;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  border-bottom: 0.5px solid var(--border);
}
#navbar-title { font-size: 17px; font-weight: 600; color: var(--text); text-align: center; padding-bottom: 10px; }
#tabs { display: flex; gap: 4px; padding-bottom: 1px; }
.tab-btn {
  flex: 1; padding: 8px 4px; font-size: 12px; font-weight: 500;
  color: var(--text3); background: none; border: none; cursor: pointer;
  border-bottom: 2px solid transparent; transition: all 0.2s; letter-spacing: 0.3px;
}
.tab-btn.active { color: var(--accent2); border-bottom-color: var(--accent2); }

/* ── PAGES ── */
#pages { flex: 1; overflow: hidden; position: relative; }
.page { position: absolute; inset: 0; overflow-y: auto; padding: 16px 16px calc(16px + var(--safe-bottom)); display: none; }
.page.active { display: block; }

/* ── CARDS ── */
.card {
  background: var(--bg2); border-radius: var(--radius);
  border: 0.5px solid var(--border); padding: 16px; margin-bottom: 12px;
}
.card-sm { padding: 12px 14px; }

/* ── SUMMARY ROW ── */
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.metric { background: var(--bg2); border-radius: var(--radius); border: 0.5px solid var(--border); padding: 14px; }
.metric-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
.metric-val { font-size: 20px; font-weight: 600; color: var(--text); }
.metric-val.up { color: var(--green); }
.metric-val.dn { color: var(--red); }
.metric-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }

/* ── HOLDINGS LIST ── */
.holding-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 0; border-bottom: 0.5px solid var(--border); cursor: pointer;
  transition: opacity 0.15s;
}
.holding-row:last-child { border-bottom: none; }
.holding-row:active { opacity: 0.6; }
.holding-left { display: flex; flex-direction: column; gap: 3px; }
.holding-symbol { font-size: 15px; font-weight: 600; color: var(--text); }
.holding-name { font-size: 12px; color: var(--text3); }
.holding-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.holding-pnl { font-size: 15px; font-weight: 600; }
.holding-pct { font-size: 12px; }
.up { color: var(--green); }
.dn { color: var(--red); }
.neu { color: var(--text2); }

/* ── DETAIL PAGE ── */
#detail-page { background: var(--bg); }
.detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.back-btn { background: var(--bg3); border: none; color: var(--text); border-radius: 10px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.detail-symbol { font-size: 22px; font-weight: 700; }
.detail-name { font-size: 13px; color: var(--text3); }

.trade-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 11px 0; border-bottom: 0.5px solid var(--border);
}
.trade-row:last-child { border-bottom: none; }
.trade-left { display: flex; flex-direction: column; gap: 3px; }
.trade-type-badge {
  display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px;
  border-radius: 6px; letter-spacing: 0.5px;
}
.badge-buy { background: rgba(34,197,94,0.15); color: var(--green); }
.badge-sell { background: rgba(239,68,68,0.15); color: var(--red); }
.trade-date { font-size: 12px; color: var(--text3); }
.trade-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.trade-price { font-size: 15px; font-weight: 600; color: var(--text); }
.trade-shares { font-size: 12px; color: var(--text3); }

/* ── CASHFLOW PAGE ── */
.cf-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; border-bottom: 0.5px solid var(--border);
}
.cf-row:last-child { border-bottom: none; }
.cf-type { font-size: 13px; font-weight: 500; }
.cf-date { font-size: 12px; color: var(--text3); margin-top: 2px; }
.cf-amt { font-size: 16px; font-weight: 600; }

/* ── ADD FORM ── */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 12px; color: var(--text3); margin-bottom: 6px; display: block; letter-spacing: 0.3px; text-transform: uppercase; }
.form-input, .form-select {
  width: 100%; background: var(--bg3); border: 0.5px solid var(--border);
  color: var(--text); border-radius: 10px; padding: 12px 14px; font-size: 15px;
  outline: none; -webkit-appearance: none;
  transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus { border-color: var(--accent); }
.form-select option { background: var(--bg3); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-primary {
  width: 100%; background: var(--accent); color: #fff; border: none;
  border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 600;
  cursor: pointer; margin-top: 6px; transition: background 0.2s;
}
.btn-primary:active { background: #2563eb; }
.btn-ghost {
  background: var(--bg3); color: var(--text2); border: 0.5px solid var(--border);
  border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 500;
  cursor: pointer; width: 100%; margin-top: 8px;
}
.section-title { font-size: 13px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; margin-top: 4px; }

/* ── IMPORT MODAL ── */
#import-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0 0 var(--safe-bottom);
}
#import-sheet {
  background: var(--bg2); border-radius: 20px 20px 0 0;
  width: 100%; max-width: 480px; padding: 24px 20px;
  border-top: 0.5px solid var(--border);
}
.sheet-handle { width: 36px; height: 4px; background: var(--bg4); border-radius: 2px; margin: 0 auto 20px; }
.hidden { display: none !important; }

/* ── SPARKLINE AREA ── */
.price-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 4px; }
.current-price { font-size: 28px; font-weight: 700; }
.price-change { font-size: 13px; padding: 3px 8px; border-radius: 6px; font-weight: 500; }
.price-change.up { background: rgba(34,197,94,0.15); color: var(--green); }
.price-change.dn { background: rgba(239,68,68,0.15); color: var(--red); }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: calc(90px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--bg3); color: var(--text); padding: 10px 20px;
  border-radius: 20px; font-size: 14px; opacity: 0; transition: all 0.3s; z-index: 300;
  border: 0.5px solid var(--border); white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── LOADING ── */
.loading-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin: 0 2px; animation: bounce 1.2s infinite; }
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }
.divider { height: 0.5px; background: var(--border); margin: 8px 0; }
</style>
</head>

<script>
// ══════════════════════════════════════
// DATA LAYER — IndexedDB
// ══════════════════════════════════════
let db;
const DB_NAME = 'StockPWA';
const DB_VERSION = 2;

async function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('trades')) {
        const s = d.createObjectStore('trades', {keyPath:'id', autoIncrement:true});
        s.createIndex('symbol', 'symbol');
        s.createIndex('date', 'date');
      }
      if (!d.objectStoreNames.contains('cashflow')) {
        d.createObjectStore('cashflow', {keyPath:'id', autoIncrement:true});
      }
      if (!d.objectStoreNames.contains('settings')) {
        d.createObjectStore('settings', {keyPath:'key'});
      }
      if (!d.objectStoreNames.contains('prices')) {
        d.createObjectStore('prices', {keyPath:'symbol'});
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(); };
    req.onerror = () => reject(req.error);
  });
}

function dbGet(store, key) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function dbGetAll(store) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function dbPut(store, val) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(val);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function dbAdd(store, val) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).add(val);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function dbClear(store) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).clear().onsuccess = () => res();
  });
}

// ══════════════════════════════════════
// FINANCE CALCULATIONS
// ══════════════════════════════════════
const FEE_RATE = 0.001425;
const TAX_RATE = 0.003;
const INSURANCE_RATE = 0.002;
const INSURANCE_THRESHOLD = 20000;

function calcFee(amount, discount) {
  return Math.max(1, Math.round(amount * FEE_RATE * discount));
}
function calcTax(amount) {
  return Math.round(amount * TAX_RATE);
}
function calcInsurance(amount, enabled) {
  if (!enabled || amount < INSURANCE_THRESHOLD) return 0;
  return Math.round(amount * INSURANCE_RATE);
}
function calcNet(type, price, shares, discount, insurance) {
  const amount = price * shares;
  const fee = calcFee(amount, discount);
  const tax = type === 'sell' ? calcTax(amount) : 0;
  const ins = type === 'sell' ? calcInsurance(amount, insurance) : 0;
  return type === 'buy'
    ? -(amount + fee + ins)
    :  (amount - fee - tax - ins);
}

// ══════════════════════════════════════
// HOLDINGS CALCULATION
// ══════════════════════════════════════
let cachedPrices = {};
let settings = { defaultDiscount: 0.28, insurance: false };

async function computeHoldings(trades) {
  const holdings = {};
  for (const t of trades.sort((a,b) => a.date.localeCompare(b.date))) {
    if (!holdings[t.symbol]) {
      holdings[t.symbol] = { symbol: t.symbol, shares: 0, totalCost: 0, avgCost: 0, realized: 0, trades: [] };
    }
    const h = holdings[t.symbol];
    h.trades.push(t);
    if (t.type === 'buy') {
      const cost = t.price * t.shares + calcFee(t.price * t.shares, t.fee_discount || 0.28);
      h.totalCost += cost;
      h.shares += t.shares;
      h.avgCost = h.shares > 0 ? h.totalCost / h.shares : 0;
    } else if (t.type === 'sell') {
      const sellAmt = t.price * t.shares;
      const fee = calcFee(sellAmt, t.fee_discount || 0.28);
      const tax = calcTax(sellAmt);
      const ins = settings.insurance ? calcInsurance(sellAmt, true) : 0;
      const realizedGain = (t.price - h.avgCost) * t.shares - fee - tax - ins;
      h.realized += realizedGain;
      h.totalCost -= h.avgCost * t.shares;
      h.shares -= t.shares;
      if (h.shares <= 0) { h.shares = 0; h.totalCost = 0; h.avgCost = 0; }
      else { h.avgCost = h.totalCost / h.shares; }
    }
  }
  return Object.values(holdings).filter(h => h.shares > 0 || h.realized !== 0);
}

async function fetchPrices() {
  const trades = await dbGetAll('trades');
  const held = new Set();
  const cnt = {};
  for (const t of trades) {
    cnt[t.symbol] = (cnt[t.symbol] || 0) + (t.type === 'buy' ? t.shares : -t.shares);
  }
  for (const [sym, qty] of Object.entries(cnt)) {
    if (qty > 0) held.add(sym);
  }
  if (held.size === 0) return;

  document.getElementById('price-loading').classList.remove('hidden');

  const symbols = [...held];
  const twseSyms = symbols.filter(s => !s.endsWith('B') && !s.startsWith('006') || s === '006208');
  const allSyms = symbols;

  try {
    // Use TWSE API via CORS proxy concept — direct fetch to TWSE
    // Format: tse_XXXX.tw for listed, otc_XXXX.tw for OTC
    const queryStr = allSyms.map(s => `tse_${s}.tw`).join('|');
    const url = `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${queryStr}&json=1&delay=0`;
    
    const resp = await fetch(url, { signal: AbortSignal.timeout(8000) });
    const data = await resp.json();
    
    if (data.msgArray) {
      for (const item of data.msgArray) {
        const sym = item.c;
        const price = parseFloat(item.z || item.y || 0); // z=現價, y=昨收
        const yesterday = parseFloat(item.y || 0);
        const change = price - yesterday;
        const changePct = yesterday ? (change / yesterday * 100) : 0;
        if (price > 0) {
          cachedPrices[sym] = { price, change, changePct, time: item.t || '' };
          await dbPut('prices', { symbol: sym, price, change, changePct, time: item.t || '', updated: Date.now() });
        }
      }
    }
  } catch(e) {
    // Load from cache
    const cached = await dbGetAll('prices');
    for (const p of cached) cachedPrices[p.symbol] = p;
  }

  document.getElementById('price-loading').classList.add('hidden');
  renderHoldings();
}

// RENDER FUNCTIONS
// ══════════════════════════════════════
function fmt(n) { return Math.round(n).toLocaleString('zh-TW'); }
function fmtSign(n) { return (n >= 0 ? '+' : '') + fmt(n); }
function fmtPct(n) { return (n >= 0 ? '+' : '') + n.toFixed(2) + '%'; }

async function renderHoldings() {
  const trades = await dbGetAll('trades');
  const holdings = await computeHoldings(trades);
  const activeHoldings = holdings.filter(h => h.shares > 0);
  const closedHoldings = holdings.filter(h => h.shares === 0 && h.realized !== 0);

  let totalMktVal = 0, totalCost = 0, totalRealized = 0;
  for (const h of activeHoldings) {
    const p = cachedPrices[h.symbol];
    const mktVal = p ? p.price * h.shares : h.totalCost;
    totalMktVal += mktVal;
    totalCost += h.totalCost;
  }
  for (const h of holdings) totalRealized += h.realized;

  const cashflows = await dbGetAll('cashflow');
  const totalDeposit = cashflows.filter(c => c.type==='deposit').reduce((s,c)=>s+c.amount,0);
  const totalWithdraw = cashflows.filter(c => c.type==='withdraw').reduce((s,c)=>s+c.amount,0);
  const totalDividend = cashflows.filter(c => c.type==='dividend').reduce((s,c)=>s+c.amount,0);
  const cash = totalDeposit - totalWithdraw + totalDividend
    - trades.filter(t=>t.type==='buy').reduce((s,t)=>s+t.price*t.shares+calcFee(t.price*t.shares,t.fee_discount||0.28),0)
    + trades.filter(t=>t.type==='sell').reduce((s,t)=>s+t.price*t.shares-calcFee(t.price*t.shares,t.fee_discount||0.28)-calcTax(t.price*t.shares),0);

  const unrealized = totalMktVal - totalCost;
  const unrealizedPct = totalCost ? (unrealized / totalCost * 100) : 0;
  const netWorth = totalMktVal + cash;

  const totalValEl = document.getElementById('total-value');
  totalValEl.textContent = '$ ' + fmt(totalMktVal);
  document.getElementById('total-cost-sub').textContent = '成本 $' + fmt(totalCost);

  const pnlEl = document.getElementById('unrealized-pnl');
  pnlEl.textContent = fmtSign(unrealized);
  pnlEl.className = 'metric-val ' + (unrealized >= 0 ? 'up' : 'dn');
  document.getElementById('unrealized-pct').textContent = fmtPct(unrealizedPct);

  const rpEl = document.getElementById('realized-pnl');
  rpEl.textContent = fmtSign(totalRealized);
  rpEl.className = 'metric-val ' + (totalRealized >= 0 ? 'up' : 'dn');

  document.getElementById('net-worth').textContent = '$ ' + fmt(netWorth);
  document.getElementById('cash-sub').textContent = '現金 $' + fmt(cash);

  // Holdings list
  const list = document.getElementById('holdings-list');
  if (activeHoldings.length === 0) {
    list.innerHTML = '<div class="empty-state">尚無持倉資料<br>前往新增頁面加入交易</div>';
    return;
  }

  list.innerHTML = activeHoldings.map(h => {
    const p = cachedPrices[h.symbol];
    const mktVal = p ? p.price * h.shares : h.totalCost;
    const unreal = mktVal - h.totalCost;
    const unrealPct = h.totalCost ? (unreal / h.totalCost * 100) : 0;
    const name = STOCK_NAMES[h.symbol] || '';
    const priceStr = p ? `$${p.price.toFixed(2)} <span style="color:${p.change>=0?'var(--green)':'var(--red)'};font-size:11px;">${fmtSign(p.change)}</span>` : `成本 $${h.avgCost.toFixed(2)}`;
    return `
    <div class="holding-row" onclick="showDetail('${h.symbol}')">
      <div class="holding-left">
        <div class="holding-symbol">${h.symbol}</div>
        <div class="holding-name">${name} · ${h.shares}股 · ${priceStr}</div>
      </div>
      <div class="holding-right">
        <div class="holding-pnl ${unreal>=0?'up':'dn'}">${fmtSign(unreal)}</div>
        <div class="holding-pct ${unreal>=0?'up':'dn'}">${fmtPct(unrealPct)}</div>
      </div>
    </div>`;
  }).join('');
}

    const amt = t.price * t.shares;

  switchToPage('detail');
}

function updateCalc() {
  const type = document.getElementById('f-type').value;
  const price = parseFloat(document.getElementById('f-price').value) || 0;
  const shares = parseInt(document.getElementById('f-shares').value) || 0;
  const discount = parseFloat(document.getElementById('f-discount').value) || 0.28;

  if (!price || !shares) {
    document.getElementById('calc-amount').textContent = '—';
    document.getElementById('calc-fee').textContent = '—';
    document.getElementById('calc-tax').textContent = '—';
    document.getElementById('calc-net').textContent = '—';
    return;
  }
  const amount = price * shares;
  const fee = calcFee(amount, discount);
  const tax = type === 'sell' ? calcTax(amount) : 0;
  const ins = settings.insurance ? calcInsurance(amount, true) : 0;
  const net = type === 'buy' ? -(amount + fee + ins) : (amount - fee - tax - ins);

  document.getElementById('calc-amount').textContent = '$' + fmt(amount);
  document.getElementById('calc-fee').textContent = '$' + fee;
  document.getElementById('calc-tax-row').style.display = type === 'sell' ? 'flex' : 'none';
  document.getElementById('calc-tax').textContent = '$' + tax;
  document.getElementById('calc-net').textContent = (net < 0 ? '-' : '+') + '$' + fmt(Math.abs(net));
  document.getElementById('calc-net').style.color = net < 0 ? 'var(--red)' : 'var(--green)';
}

async function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    let data;

    // 嘗試解析原桌面軟體格式
    const lines = text.split('\n');
    if (lines[0].trim().startsWith('v')) {
      // 桌面軟體格式
      const json = lines.slice(1).join('\n');
      const raw = JSON.parse(json);
      const acc = raw[0];

      await dbClear('trades');
      await dbClear('cashflow');

      const trades = [];
      for (const [sym, symTrades] of Object.entries(acc.trading_data || {})) {
        for (const t of symTrades) {
          if (t.trading_type === 0) continue;
          trades.push({
            symbol: sym,
            type: t.trading_type === 2 ? 'buy' : t.trading_type === 1 ? 'sell' : 'dividend',
            price: t.per_share_trading_price,
            shares: t.trading_count,
            date: t.trading_date,
            fee_discount: Math.round(t.trading_fee_discount * 100) / 100,
          });
        }
      }
      for (const t of trades) await dbAdd('trades', t);

      for (const tr of (acc.transfer_data || [])) {
        await dbAdd('cashflow', {
          type: tr.transfer_type === 0 ? 'deposit' : 'withdraw',
          amount: tr.transfer_value,
          date: tr.transfer_date,
          note: '',
        });
      }
      showToast(`匯入完成：${trades.length} 筆交易`);
    } else {
      // PWA 備份格式
      data = JSON.parse(text);
      await dbClear('trades');
      await dbClear('cashflow');
      for (const t of (data.trades || [])) await dbAdd('trades', t);
      for (const c of (data.cashflow || [])) await dbAdd('cashflow', c);
      showToast(`匯入完成：${(data.trades||[]).length} 筆交易`);
    }
    await fetchPrices();
    renderHoldings();
    renderSettings();
  } catch(e) {
    showToast('匯入失敗：' + e.message);
  }
  event.target.value = '';
}

async function exportData() {
  const trades = await dbGetAll('trades');
  const cashflow = await dbGetAll('cashflow');
  const blob = new Blob([JSON.stringify({trades, cashflow, exported: new Date().toISOString()}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'stock-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('匯出完成');
}

async function clearAll() {
  await dbClear('trades');
  await dbClear('cashflow');
  await dbClear('prices');
  cachedPrices = {};
  showToast('已清除所有資料');
  renderHoldings();
  renderSettings();
}

// ══════════════════════════════════════
// SETTINGS
// ══════════════════════════════════════
async function loadSettings() {
  const disc = await dbGet('settings', 'defaultDiscount');
  if (disc) settings.defaultDiscount = parseFloat(disc.value);
  const ins = await dbGet('settings', 'insurance');
  if (ins) settings.insurance = ins.value;

  document.getElementById('s-discount').value = settings.defaultDiscount;
  document.getElementById('f-discount').value = settings.defaultDiscount;
  updateToggle();
}

async function saveSetting(key, value) {
  await dbPut('settings', {key, value});
  settings[key] = value;
}

function toggleInsurance() {
  settings.insurance = !settings.insurance;
  saveSetting('insurance', settings.insurance);
  updateToggle();
}

function updateToggle() {
  const track = document.getElementById('toggle-track');
  const thumb = document.getElementById('toggle-thumb');
  if (settings.insurance) {
    track.style.background = 'var(--accent)';
    thumb.style.transform = 'translateX(18px)';
  } else {
    track.style.background = 'var(--bg4)';
    thumb.style.transform = 'translateX(0)';
  }
}

async function renderSettings() {
  const trades = await dbGetAll('trades');
  const cashflows = await dbGetAll('cashflow');
  document.getElementById('stat-trades').textContent = trades.length + ' 筆';
  document.getElementById('stat-cf').textContent = cashflows.length + ' 筆';
}

// ══════════════════════════════════════
// TOAST
// ══════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

async function seedIfEmpty() {
  const existing = await dbGetAll('trades');
  if (existing.length === 0) {
    for (const t of SEED_DATA.trades) await dbAdd('trades', t);
    for (const c of SEED_DATA.cashflow) await dbAdd('cashflow', c);
    console.log('Seeded', SEED_DATA.trades.length, 'trades');
  }
}

async function init() {
  await initDB();
  await loadSettings();
  await seedIfEmpty();

  // Set today's date in form inputs
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('f-date').value = today;
  document.getElementById('cf-date').value = today;

  // Load cached prices from DB
  const cached = await dbGetAll('prices');
  for (const p of cached) cachedPrices[p.symbol] = p;

  // Render initial view
  await renderHoldings();
  renderSettings();

  // Auto-fetch prices on load
  fetchPrices();

  // Wire up live calculation
  ['f-price','f-shares','f-type','f-discount'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateCalc);
    document.getElementById(id).addEventListener('change', updateCalc);
  });

  // PWA install prompt (for guidance)
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
  });
}

init().catch(console.error);
</script>
